name: Build Legacy macOS

# macOS keeps the legacy development shell and is explicitly named legacy; no
# AA real-capture acceptance is implied. The Windows installer, its tests and
# releases are in windows-release.yml (releases are never GitHub Releases).
#
# Runs on pushes to main that touch the packaging inputs, and can be triggered
# manually. It used to run on every merge: each one then queued a second macOS
# job next to CI's macOS tests, the account's few macOS runners filled up, and
# PR macOS checks sat 16-22 minutes without a machine until GitHub cancelled
# them (2026-10-15). A newer main push cancels an older build still waiting.
#
# macOS code signing + notarization (optional): only runs if the
# MACOS_CERTIFICATE secret is set. To enable it, add these repo secrets
# (Settings -> Secrets and variables -> Actions):
#   MACOS_CERTIFICATE          base64 of your Developer ID Application .p12
#   MACOS_CERTIFICATE_PWD      password for that .p12
#   MACOS_SIGNING_IDENTITY     e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_API_KEY_ID           App Store Connect API key ID
#   APPLE_API_ISSUER           App Store Connect API issuer ID
#   APPLE_API_KEY               contents of the AuthKey_XXXX.p8 file
# Without these secrets, the workflow still runs and produces an unsigned
# build (fine for local testing; macOS will show a Gatekeeper warning on
# first launch of an unsigned/un-notarized app).

on:
  push:
    branches: [main]
    paths:
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch:

concurrency:
  group: build-legacy-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    # `secrets` is not accessible directly inside `if:` expressions; expose
    # it as a job-level env var once and gate on `env.*` in each step's `if:`.
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install -e ".[desktop,perceptual,packaging]"

      - name: Build legacy development .app
        run: |
          python -m PyInstaller packaging/pokersense.spec --distpath dist --workpath build --noconfirm

      - name: Import signing certificate
        if: ${{ env.MACOS_CERTIFICATE != '' }}
        env:
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN_PWD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          echo "$MACOS_CERTIFICATE" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" build.keychain
          rm cert.p12

      - name: Codesign + notarize
        if: ${{ env.MACOS_CERTIFICATE != '' }}
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          codesign --deep --force --options runtime \
            --sign "$MACOS_SIGNING_IDENTITY" dist/PokerSense.app

          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY" > ~/private_keys/"AuthKey_${APPLE_API_KEY_ID}.p8"

          # Notarization wants a zip/dmg of the .app, not the .app itself.
          # The stapled ticket ends up on the .app; the DMG built below just
          # carries that already-stapled .app.
          ditto -c -k --keepParent dist/PokerSense.app dist/notarize-submission.zip
          xcrun notarytool submit dist/notarize-submission.zip \
            --key ~/private_keys/"AuthKey_${APPLE_API_KEY_ID}.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple dist/PokerSense.app
          rm -f dist/notarize-submission.zip

      - name: Build .dmg
        run: |
          brew install create-dmg
          # create-dmg's Finder-styling AppleScript step is known to exit
          # non-zero on headless CI runners even when the dmg is built fine
          # -- check for the actual output file, not the exit code.
          create-dmg \
            --volname "PokerSense" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "PokerSense.app" 175 190 \
            --hide-extension "PokerSense.app" \
            --app-drop-link 425 190 \
            --no-internet-enable \
            dist/PokerSense-legacy-macos.dmg \
            dist/PokerSense.app || true
          test -f dist/PokerSense-legacy-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: PokerSense-legacy-macos
          path: dist/PokerSense-legacy-macos.dmg
