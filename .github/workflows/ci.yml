name: CI

# concurrency：同一 PR/分支的新 push 会取消还在跑的旧任务，避免叠跑浪费分钟数。
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # 只取消同一 PR 的旧任务；推到 main 的每一版都要有完整结果。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review-hygiene:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 是否改了代码（纯文档则跳过测试 job）
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python tools/ci_changes.py \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            python tools/ci_changes.py \
              "${{ github.event.before }}" \
              "${{ github.sha }}"
          else
            python tools/ci_changes.py
          fi
      - name: 私有文件名检查（不等于内容审计）
        run: python tools/check_private_files.py
      - name: PR 空白字符检查
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

  test-windows:
    name: test (windows-latest)
    needs: review-hygiene
    if: ${{ !cancelled() && needs.review-hygiene.outputs.code != 'false' }}
    timeout-minutes: 30
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      CI_EVIDENCE_NAME: pytest-windows-${{ github.run_id }}-attempt-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev,perceptual,desktop]"
      - name: Install pinned offline reference
        run: python -m pip install pokerkit==0.7.5 phevaluator==0.6.0
      - name: Test evidence identity and scope
        env:
          CI_EVIDENCE_DIR: ${{ runner.temp }}/${{ env.CI_EVIDENCE_NAME }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python -c "import json, os, subprocess, sys, tomllib, pytest;
          from pathlib import Path;
          directory = Path(os.environ['CI_EVIDENCE_DIR']);
          directory.mkdir(parents=True, exist_ok=True);
          config = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['tool']['pytest']['ini_options'];
          data = {'checkout_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
          'event_sha': os.environ['GITHUB_SHA'], 'pr_head_sha': os.environ.get('CI_PR_HEAD_SHA') or None,
          'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
          'runner_os': os.environ['RUNNER_OS'], 'python': sys.version, 'pytest': pytest.__version__,
          'node': subprocess.check_output(['node', '--version'], text=True).strip(),
          'full_scope': {'testpaths': config['testpaths'], 'addopts': config['addopts'], 'arguments': ['-v', '-ra', '-n', 'auto', '--dist', 'worksteal', '-m', 'not timing']},
          'timing_scope': {'arguments': ['-v', '-ra', '-m', 'timing']},
          'reference_scope': 'tests/tools/test_strategy_eval_independent_oracle_v1.py'};
          payload = json.dumps(data, ensure_ascii=True, indent=2);
          (directory / 'identity.json').write_text(payload + '\n', encoding='utf-8');
          print(payload)"
      - name: pytest
        id: full_pytest
        # 测试大半时间在等（计时、子进程、本机服务），不在算：按 CPU 核数分几个进程同时跑，
        # 一个不少。带 timing 标记的量真实耗时，下一步单独一个进程跑，不和别的测试抢 CPU。
        run: >-
          python -m pytest -v -ra -n auto --dist worksteal -m "not timing"
          --junitxml="${{ runner.temp }}/${{ env.CI_EVIDENCE_NAME }}/full.xml"
      - name: pytest (timing, one process)
        id: timing_pytest
        run: >-
          python -m pytest -v -ra -m timing
          --junitxml="${{ runner.temp }}/${{ env.CI_EVIDENCE_NAME }}/timing.xml"
      - name: AA realtime UI deadline regression
        run: node tests/ui/test_aa_turn_runtime_ui.js
      - name: Independent strategy evaluation reference
        id: reference_pytest
        run: >-
          python -m pytest -v -ra tests/tools/test_strategy_eval_independent_oracle_v1.py
          --junitxml="${{ runner.temp }}/${{ env.CI_EVIDENCE_NAME }}/reference.xml"
      - name: flake8
        run: python -m flake8 src tests tools research/hu_root research/coverage_bridge
      - name: Record pytest step outcomes
        if: ${{ always() }}
        env:
          CI_EVIDENCE_DIR: ${{ runner.temp }}/${{ env.CI_EVIDENCE_NAME }}
          CI_FULL_OUTCOME: ${{ steps.full_pytest.outcome }}
          CI_TIMING_OUTCOME: ${{ steps.timing_pytest.outcome }}
          CI_REFERENCE_OUTCOME: ${{ steps.reference_pytest.outcome }}
        run: >-
          python -c "import json, os; from pathlib import Path;
          directory = Path(os.environ['CI_EVIDENCE_DIR']);
          directory.mkdir(parents=True, exist_ok=True);
          data = {'full': os.environ.get('CI_FULL_OUTCOME') or 'unknown',
          'timing': os.environ.get('CI_TIMING_OUTCOME') or 'unknown',
          'reference': os.environ.get('CI_REFERENCE_OUTCOME') or 'unknown'};
          payload = json.dumps(data, indent=2);
          (directory / 'outcomes.json').write_text(payload + '\n', encoding='utf-8');
          print(payload)"

  solver-windows:
    # 杜的 Windows：按 docs/second-seat-windows.md 装 MSYS2 编译工具、编译和 Mac 同一版
    # TexasSolver，START-AA.cmd --self-check 要报 solver_ready。编译约十分钟，单独一个 job。
    name: solver build (windows-latest)
    needs: review-hygiene
    if: ${{ !cancelled() && needs.review-hygiene.outputs.code != 'false' }}
    timeout-minutes: 45
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      POKERSENSE_SOLVER_BUILD_TEST: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev,desktop]"
      - name: Build the solver the way the guide does
        run: >-
          python -m pytest -v -ra tests/desktop/test_second_seat_windows.py
          -k test_the_solver_builds_and_the_self_check_solves_with_it

  test-macos:
    name: test (macos-latest)
    needs: review-hygiene
    # macOS 按分钟贵 6 倍：草稿 PR 的 push 只跑 Windows；转正式、推 main、手动触发才跑 macOS。
    if: >-
      ${{
        !cancelled()
        && needs.review-hygiene.outputs.code != 'false'
        && (
          github.event_name == 'workflow_dispatch'
          || github.event_name == 'push'
          || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
        )
      }}
    timeout-minutes: 30
    runs-on: macos-latest
    env:
      PYTHONUTF8: "1"
      CI_EVIDENCE_NAME: pytest-macos-${{ github.run_id }}-attempt-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev,perceptual,desktop]"
      - name: Install pinned offline reference
        run: python -m pip install pokerkit==0.7.5 phevaluator==0.6.0
      - name: Test evidence identity and scope
        env:
          CI_EVIDENCE_DIR: ${{ runner.temp }}/${{ env.CI_EVIDENCE_NAME }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python -c "import json, os, subprocess, sys, tomllib, pytest;
          from pathlib import Path;
          directory = Path(os.environ['CI_EVIDENCE_DIR']);
          directory.mkdir(parents=True, exist_ok=True);
          config = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['tool']['pytest']['ini_options'];
          data = {'checkout_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
          'event_sha': os.environ['GITHUB_SHA'], 'pr_head_sha': os.environ.get('CI_PR_HEAD_SHA') or None,
          'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
          'runner_os': os.environ['RUNNER_OS'], 'python': sys.version, 'pytest': pytest.__version__,
          'node': subprocess.check_output(['node', '--version'], text=True).strip(),
          'full_scope': {'testpaths': config['testpaths'], 'addopts': config['addopts'], 'arguments': ['-v', '-ra', '-n', 'auto', '--dist', 'worksteal', '-m', 'not timing']},
          'timing_scope': {'arguments': ['-v', '-ra', '-m', 'timing']},
          'reference_scope': 'tests/tools/test_strategy_eval_independent_oracle_v1.py'};
          payload = json.dumps(data, ensure_ascii=True, indent=2);
          (directory / 'identity.json').write_text(payload + '\n', encoding='utf-8');
          print(payload)"
      - name: pytest
        id: full_pytest
        # 测试大半时间在等（计时、子进程、本机服务），不在算：按 CPU 核数分几个进程同时跑，
        # 一个不少。带 timing 标记的量真实耗时，下一步单独一个进程跑，不和别的测试抢 CPU。
        run: >-
          python -m pytest -v -ra -n auto --dist worksteal -m "not timing"
          --junitxml="${{ runner.temp }}/${{ env.CI_EVIDENCE_NAME }}/full.xml"
      - name: pytest (timing, one process)
        id: timing_pytest
        run: >-
          python -m pytest -v -ra -m timing
          --junitxml="${{ runner.temp }}/${{ env.CI_EVIDENCE_NAME }}/timing.xml"
      - name: AA realtime UI deadline regression
        run: node tests/ui/test_aa_turn_runtime_ui.js
      - name: Independent strategy evaluation reference
        id: reference_pytest
        run: >-
          python -m pytest -v -ra tests/tools/test_strategy_eval_independent_oracle_v1.py
          --junitxml="${{ runner.temp }}/${{ env.CI_EVIDENCE_NAME }}/reference.xml"
      - name: flake8
        run: python -m flake8 src tests tools research/hu_root research/coverage_bridge
      - name: Record pytest step outcomes
        if: ${{ always() }}
        env:
          CI_EVIDENCE_DIR: ${{ runner.temp }}/${{ env.CI_EVIDENCE_NAME }}
          CI_FULL_OUTCOME: ${{ steps.full_pytest.outcome }}
          CI_TIMING_OUTCOME: ${{ steps.timing_pytest.outcome }}
          CI_REFERENCE_OUTCOME: ${{ steps.reference_pytest.outcome }}
        run: >-
          python -c "import json, os; from pathlib import Path;
          directory = Path(os.environ['CI_EVIDENCE_DIR']);
          directory.mkdir(parents=True, exist_ok=True);
